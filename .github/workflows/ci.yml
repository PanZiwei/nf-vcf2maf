name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  stub-run:
    name: Nextflow stub run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "latest-stable"

      - name: Run stub
        run: |
          nextflow run main.nf \
            -stub-run \
            --input tests/stub_samplesheet.csv \
            -profile docker
