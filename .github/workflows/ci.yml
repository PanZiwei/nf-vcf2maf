name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  stub-run:
    name: Nextflow stub run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "latest-stable"

      - name: Create stub input files
        run: touch stub.tar.gz stub.fasta stub.fasta.fai

      - name: Set Nextflow secrets
        run: nextflow secrets set SYNAPSE_AUTH_TOKEN stub_token

      - name: Run stub
        run: |
          nextflow run main.nf \
            -stub-run \
            --input $PWD/tests/stub_samplesheet.csv \
            --vep_tarball $PWD/stub.tar.gz \
            --reference_fasta $PWD/stub.fasta \
            --reference_fasta_fai $PWD/stub.fasta.fai \
            --max_cpus 4 \
            --max_memory '8.GB'
